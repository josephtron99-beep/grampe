<!doctype html>
<html lang="en" class="no-js" data-theme="night">
<head>
  <meta charset="utf-8">
  <script>document.documentElement.classList.remove("no-js");</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grampe Wallet · Dashboard V2</title>
  <meta name="description" content="Grampe wallet dashboard, version 2: balances, send, receive, swap, transfer, UPI, cards, staking and gift cards.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#04061A">
  <link rel="icon" href="../assets/img/shield.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Design system: tokens (night theme) → components → V2 page -->
  <link rel="stylesheet" href="../assets/css/tokens.css?v=20261111c">
  <link rel="stylesheet" href="../assets/css/components.css?v=20261111c">
  <link rel="stylesheet" href="../dashboard/dashboard.css?v=20261111c"><!-- shared page patterns (forms, rows, summaries) -->
  <link rel="stylesheet" href="v2.css?v=20261111c">
</head>
<body class="v2">

<!-- intro splash -->
<div class="intro" id="intro" aria-hidden="true">
  <div class="intro-mark"><img src="../assets/img/shield.svg" alt="" width="56" height="64"><span>Grampe</span></div>
</div>
<script>setTimeout(function () { document.body.classList.add("ready"); }, 2500);</script>

<!-- animated background -->
<div class="mesh" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="grid-lines"></i></div>

<!-- ============ TOP MENU ============ -->
<header class="nav2" id="nav2">
  <div class="nav2-inner">
    <a href="#/home" class="nav2-logo" aria-label="Grampe dashboard home"><img src="../assets/img/shield.svg" alt="" width="28" height="32"><span>Grampe</span></a>

    <nav class="nav2-links" id="topNav" aria-label="Main"><!-- built by app.js --></nav>

    <div class="nav2-right">
      <button class="nav2-search" id="openPalette" aria-label="Search or jump to (Ctrl K)"><svg class="ico"><use href="../assets/img/icons.svg#i-search"/></svg><span class="kbd">Ctrl K</span></button>
      <span class="nav2-price" id="tbPrice" title="GCC price (demo)"><span class="coin coin-sm coin-gcc">G</span><b id="tbPriceVal">$1.2100</b><span id="tbPriceChg">▲ 2.4%</span></span>
      <button class="nav2-icon" id="openNotif" aria-label="Notifications"><svg class="ico"><use href="../assets/img/icons.svg#i-bell"/></svg><i class="tb-dot"></i></button>
      <div class="tb-user">
        <button class="nav2-avatar" id="userBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="userMenu"><span class="avatar avatar-sm avatar-1" id="userInitials">AM</span></button>
        <div class="menu" id="userMenu" role="menu" hidden>
          <div class="menu-head"><b id="userName">Aarav Mehta</b><small id="userId">ID 100245</small></div>
          <a role="menuitem" href="#/profile"><svg class="ico"><use href="../assets/img/icons.svg#i-user"/></svg>My profile</a>
          <a role="menuitem" href="#/security"><svg class="ico"><use href="../assets/img/icons.svg#i-lock"/></svg>Update password</a>
          <a role="menuitem" href="#/referral"><svg class="ico"><use href="../assets/img/icons.svg#i-users"/></svg>Refer &amp; earn</a>
          <a role="menuitem" href="../dashboard/"><svg class="ico"><use href="../assets/img/icons.svg#i-sidebar"/></svg>Switch to V1 layout</a>
          <hr>
          <button role="menuitem" data-action="logout" class="menu-danger"><svg class="ico"><use href="../assets/img/icons.svg#i-logout"/></svg>Log out</button>
        </div>
      </div>
      <button class="nav2-burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="mMenu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<!-- mobile full-screen menu -->
<div class="m-menu" id="mMenu" aria-hidden="true"><nav id="mMenuNav" aria-label="Mobile"></nav></div>

<main class="view" id="view" tabindex="-1" aria-live="polite"></main>

<button class="fab2" data-action="quick" aria-label="Quick actions"><svg class="ico"><use href="../assets/img/icons.svg#i-plus"/></svg></button>

<!-- overlay host -->
<div class="overlay" id="overlay" aria-hidden="true">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <div class="panel-head"><h2 id="panelTitle">Title</h2><button class="icon-btn icon-btn-sm" data-action="close" aria-label="Close"><svg class="ico"><use href="../assets/img/icons.svg#i-x"/></svg></button></div>
    <div class="panel-body" id="panelBody"></div>
  </div>
</div>

<!-- command palette -->
<div class="overlay overlay-modal palette" id="palette" aria-hidden="true">
  <div class="panel" role="dialog" aria-modal="true" aria-label="Search or jump to">
    <div class="pal-search"><svg class="ico"><use href="../assets/img/icons.svg#i-search"/></svg><input id="palInput" type="text" placeholder="Search pages, actions or assets…" autocomplete="off" aria-label="Search"><span class="kbd">Esc</span></div>
    <ul class="pal-list" id="palList" role="listbox"></ul>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
<script src="../dashboard/data.js?v=20261111c" defer></script>
<script src="app.js?v=20261111c" defer></script>
</body>
</html>
