<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <script>document.documentElement.classList.remove("no-js");</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grampe Wallet · Dashboard</title>
  <meta name="description" content="Grampe wallet dashboard: balances, send, receive, swap, transfer, UPI, cards, staking and gift cards.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0500FF">
  <link rel="icon" href="../assets/img/shield.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Design system: tokens → components → page -->
  <link rel="stylesheet" href="../assets/css/tokens.css?v=20261111c">
  <link rel="stylesheet" href="../assets/css/components.css?v=20261111c">
  <link rel="stylesheet" href="dashboard.css?v=20261111c">
</head>
<body class="app-body">

<div class="app" id="app">

  <!-- ============ SIDEBAR (desktop) ============ -->
  <aside class="sidebar" id="sidebar" aria-label="Dashboard navigation">
    <div class="sb-top">
      <a href="#/home" class="sb-logo" aria-label="Grampe dashboard home">
        <img src="../assets/img/shield.svg" alt="" width="28" height="32"><span>Grampe</span>
      </a>
      <button class="icon-btn icon-btn-sm sb-collapse" id="sbCollapse" aria-label="Collapse sidebar" title="Collapse sidebar"><svg class="ico"><use href="../assets/img/icons.svg#i-sidebar"/></svg></button>
    </div>
    <nav class="sb-nav" id="sbNav"><!-- built by app.js from the route list --></nav>
    <div class="sb-foot">
      <a class="sb-help" href="https://t.me/GramchainNetwork" target="_blank" rel="noopener">
        <span class="icon-tile icon-tile-sm tone-sky"><svg class="ico"><use href="../assets/img/icons.svg#i-tg"/></svg></span>
        <span class="sb-label"><b>Need help?</b><small>Telegram community</small></span>
      </a>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar" id="topbar">
      <div class="tb-left">
        <a href="#/home" class="tb-logo" aria-label="Grampe dashboard home"><img src="../assets/img/shield.svg" alt="" width="26" height="30"></a>
        <div class="tb-title">
          <p class="caption" id="tbCrumb">Dashboard</p>
          <h1 id="tbTitle">Home</h1>
        </div>
      </div>
      <div class="tb-right">
        <button class="tb-search" id="openPalette" aria-label="Search or jump to (Ctrl K)">
          <svg class="ico"><use href="../assets/img/icons.svg#i-search"/></svg><span>Search or jump to…</span><span class="kbd">Ctrl K</span>
        </button>
        <span class="badge badge-outline tb-price" id="tbPrice" title="GCC price (demo)"><span class="coin coin-sm coin-gcc">G</span><span id="tbPriceVal">$1.2100</span><span class="text-success" id="tbPriceChg">▲ 2.4%</span></span>
        <span class="badge badge-primary tb-demo" title="Balances and activity are demo data">Demo data</span>
        <button class="icon-btn tb-icon" id="openNotif" aria-label="Notifications"><svg class="ico"><use href="../assets/img/icons.svg#i-bell"/></svg><i class="tb-dot"></i></button>
        <div class="tb-user">
          <button class="tb-avatar" id="userBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="userMenu">
            <span class="avatar avatar-sm avatar-5" id="userInitials">AM</span>
            <span class="tb-user-name"><b id="userName">Aarav Mehta</b><small id="userId">ID 100245</small></span>
            <svg class="ico"><use href="../assets/img/icons.svg#i-chevron-down"/></svg>
          </button>
          <div class="menu" id="userMenu" role="menu" hidden>
            <a role="menuitem" href="#/profile"><svg class="ico"><use href="../assets/img/icons.svg#i-user"/></svg>My profile</a>
            <a role="menuitem" href="#/security"><svg class="ico"><use href="../assets/img/icons.svg#i-lock"/></svg>Update password</a>
            <a role="menuitem" href="#/wallet"><svg class="ico"><use href="../assets/img/icons.svg#i-wallet"/></svg>Wallet</a>
            <a role="menuitem" href="#/referral"><svg class="ico"><use href="../assets/img/icons.svg#i-users"/></svg>Refer &amp; earn</a>
            <a role="menuitem" href="v2/"><svg class="ico"><use href="../assets/img/icons.svg#i-star"/></svg>Try V2 layout</a>
            <a role="menuitem" href="v3/"><svg class="ico"><use href="../assets/img/icons.svg#i-grid"/></svg>Try V3 overview</a>
            <hr>
            <button role="menuitem" data-action="logout" class="menu-danger"><svg class="ico"><use href="../assets/img/icons.svg#i-logout"/></svg>Log out</button>
          </div>
        </div>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1" aria-live="polite"><!-- current page --></main>
  </div>

  <!-- ============ BOTTOM TAB BAR (phones) ============ -->
  <nav class="tabbar" aria-label="Quick navigation">
    <a href="#/home" data-tab="home"><svg class="ico"><use href="../assets/img/icons.svg#i-home"/></svg><span>Home</span></a>
    <a href="#/wallet" data-tab="wallet"><svg class="ico"><use href="../assets/img/icons.svg#i-wallet"/></svg><span>Wallet</span></a>
    <button class="tab-fab" data-action="quick" aria-label="Quick actions"><svg class="ico"><use href="../assets/img/icons.svg#i-plus"/></svg></button>
    <a href="#/cards" data-tab="cards"><svg class="ico"><use href="../assets/img/icons.svg#i-card"/></svg><span>Cards</span></a>
    <button data-action="more" data-tab="more"><svg class="ico"><use href="../assets/img/icons.svg#i-grid"/></svg><span>More</span></button>
  </nav>
</div>

<!-- shared overlay host (modal / drawer / sheet) -->
<div class="overlay" id="overlay" aria-hidden="true">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <div class="panel-head"><h2 id="panelTitle">Title</h2><button class="icon-btn icon-btn-sm" data-action="close" aria-label="Close"><svg class="ico"><use href="../assets/img/icons.svg#i-x"/></svg></button></div>
    <div class="panel-body" id="panelBody"></div>
  </div>
</div>

<!-- command palette -->
<div class="overlay overlay-modal palette" id="palette" aria-hidden="true">
  <div class="panel" role="dialog" aria-modal="true" aria-label="Search or jump to">
    <div class="pal-search"><svg class="ico"><use href="../assets/img/icons.svg#i-search"/></svg><input id="palInput" type="text" placeholder="Search pages, actions or assets…" autocomplete="off" aria-label="Search"><span class="kbd">Esc</span></div>
    <ul class="pal-list" id="palList" role="listbox"></ul>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
<script src="data.js?v=20261111c" defer></script>
<script src="app.js?v=20261111c" defer></script>
</body>
</html>
